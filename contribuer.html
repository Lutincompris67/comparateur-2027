<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Contribuer — Comparateur 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F5F0; --card:#FFFFFF; --ink:#27221B; --ink-2:#5C5346; --ink-3:#978D7E;
  --terre:#CC7A48; --terre-deep:#B05F2E; --terre-soft:#F4E2D2; --terre-mist:#FBF1E9;
  --graphite:#6B6459; --graphite-soft:#EFEDE8; --rule:#E0DACF; --rule-soft:#ECE8DF;
  --vert:#1D7A5F; --vert-soft:#E2F1EB; --rouge:#A31D1D; --rouge-soft:#F8E4E1;
  --serif:"Source Serif 4",Georgia,serif; --sans:"Archivo",system-ui,sans-serif; --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
a{color:var(--terre-deep)}
button,input,select,textarea{font-family:var(--sans);font-size:14.5px;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--terre);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:20}
.head-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--serif);font-size:20px;font-weight:600}
.brand span{font-size:11.5px;color:var(--ink-2);font-style:italic}
.who{font-size:13px;color:var(--ink-2);display:flex;gap:10px;align-items:center}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin:18px 0 20px}
.tab{border:none;background:none;font-weight:600;color:var(--ink-2);padding:9px 12px;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--terre-deep);border-color:var(--terre)}
.tab .n{display:inline-block;min-width:19px;padding:0 5px;margin-left:5px;border-radius:10px;background:var(--terre);color:#fff;font-size:11.5px;text-align:center}
h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:26px 0 8px}
h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 10px}
h3{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:20px 0 8px}
p{margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.muted{color:var(--ink-3);font-size:13px}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:600;color:var(--ink-2)}
.btn:hover{border-color:var(--graphite);color:var(--ink)}
.btn.pri{background:var(--terre-deep);border-color:var(--terre-deep);color:#fff}
.btn.pri:hover{background:#9A5124;color:#fff}
.btn.danger{color:var(--rouge);border-color:#E3BDB8}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:190px}
.row>.narrow{flex:0 0 110px;min-width:110px}
.field{margin-bottom:13px}
.field label,.lab{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.field small{display:block;color:var(--ink-3);font-size:12px;margin-top:3px}
.choix{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);margin:8px 0;cursor:pointer;line-height:1.45}
.choix input{margin-top:3px;flex:none;width:16px;height:16px}
input[type=text],input[type=number],input[type=search],input[type=url],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:8px;background:#fff}
textarea{min-height:230px;line-height:1.6;resize:vertical}
textarea.court{min-height:90px}
textarea.verb{font-family:var(--serif);font-size:15.5px;min-height:130px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{border:1px solid var(--rule);background:var(--card);border-radius:20px;padding:7px 15px;font-weight:600;color:var(--ink-2)}
.pill.on{background:var(--terre-soft);border-color:var(--terre);color:var(--terre-deep)}
.note{border-radius:8px;padding:9px 12px;font-size:13.5px;margin:8px 0}
.note.warn{background:var(--terre-mist);border:1px solid var(--terre-soft);color:#7A4A26}
.note.err{background:var(--rouge-soft);border:1px solid #E3BDB8;color:var(--rouge)}
.note.ok{background:var(--vert-soft);border:1px solid #BFE0D3;color:var(--vert)}
.note.info{background:var(--graphite-soft);border:1px solid var(--rule);color:var(--ink-2)}
.note ul{margin-left:18px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--graphite-soft);color:var(--graphite)}
.badge.attente{background:var(--terre-soft);color:var(--terre-deep)}
.badge.publie{background:var(--vert-soft);color:var(--vert)}
.badge.refuse,.badge.hors{background:var(--rouge-soft);color:var(--rouge)}
.meta{font-size:12.5px;color:var(--ink-3);margin:4px 0 10px}
.meta b{color:var(--ink-2)}
.texte{border-left:4px solid var(--graphite);padding:4px 0 4px 14px;margin:10px 0;font-size:14.5px;line-height:1.7;overflow-wrap:anywhere}
.texte p+p{margin-top:.8em}
.texte.verb{font-family:var(--serif);border-color:var(--terre)}
.texte.verb::before{content:"«\00a0";color:var(--ink-3)}
.texte.verb::after{content:"\00a0»";color:var(--ink-3)}
.texte.pp{border-color:#7A4E83}
.texte sup{font-weight:600;color:var(--terre-deep)}
.texte figure{margin:12px 0;padding:10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font-size:12.5px;color:var(--ink-2)}
.texte figure img{display:block;max-width:100%;height:auto;margin-bottom:6px;border-radius:5px}
.srcs{font-size:13px;color:var(--ink-2);margin:6px 0 0 20px}
.srcs li{margin-bottom:4px;overflow-wrap:anywhere}
.srcline{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--rule-soft);font-size:13.5px}
.srcline .num{font-weight:700;color:var(--terre-deep);min-width:28px}
.srcline .t{flex:1;overflow-wrap:anywhere}
.results button{display:block;width:100%;text-align:left;border:none;border-bottom:1px solid var(--rule-soft);background:none;padding:7px 4px;font-size:13.5px}
.results button:hover{background:var(--terre-mist)}
details{margin:10px 0}
details>summary{cursor:pointer;font-weight:600;color:var(--terre-deep);font-size:13.5px}
details>div{padding:12px 0 0}
table.droits{width:100%;border-collapse:collapse;font-size:14px}
table.droits th,table.droits td{padding:8px 6px;border-bottom:1px solid var(--rule-soft);text-align:center}
table.droits th:first-child,table.droits td:first-child{text-align:left}
table.droits th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3)}
table.droits input{width:18px;height:18px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.drop{border:2px dashed var(--terre);border-radius:12px;background:#fff;padding:30px 16px;text-align:center;cursor:pointer;color:var(--terre-deep);font-weight:600}
dialog{border:1px solid var(--rule);border-radius:12px;padding:20px;max-width:460px;width:calc(100% - 32px);margin:auto}
dialog::backdrop{background:rgba(45,32,22,.45)}
.compte{font-size:12.5px;color:var(--ink-3);text-align:right;margin-top:3px}
.compte.trop{color:var(--rouge);font-weight:700}
.filtre{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.filtre label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.filtre select{width:auto;max-width:100%;min-width:240px}
.filtre .muted{margin-left:auto}
.badge.retire{background:var(--graphite-soft);color:var(--graphite)}
.caseline{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--rule-soft);font-size:13.5px;cursor:pointer}
.caseline input{margin-top:3px;flex:none;width:16px;height:16px}
.caseline .t{flex:1;min-width:0;overflow-wrap:anywhere}
.caseline .ex{display:block;font-family:var(--serif);color:var(--ink-2);font-size:13.5px;margin-top:2px}
.caseline .aussi{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.doc-liens{font-size:13px;overflow-wrap:anywhere}
.compteurs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.compteurs button{border:1px solid var(--rule);background:var(--card);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink-2)}
.compteurs button.on{background:var(--terre-soft);border-color:var(--terre);color:var(--terre-deep)}
.compteurs button.alerte{border-color:#E3BDB8;color:var(--rouge)}
.compteurs button.alerte.on{background:var(--rouge-soft);border-color:var(--rouge)}
.filtres-mes{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.filtres-mes>div{flex:1;min-width:150px}
.filtres-mes>div.large{flex:2;min-width:220px}
.filtres-mes label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:3px}
.card.a-reprendre{border-color:#E3BDB8;border-left:4px solid var(--rouge)}
.tab .n.alerte{background:var(--rouge)}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="wrap head-in">
    <a class="brand" href="index.html"><b>Comparateur 2027</b><span>Espace des contributeurs</span></a>
    <div class="who" id="who"></div>
  </div>
</header>
<main class="wrap" id="app"><p class="muted" style="margin-top:30px">Chargement…</p></main>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
/* ===== Réglages ===== */
var SUPABASE_URL = 'https://bwkqtcxygzxcvrbzvdzg.supabase.co';
var SUPABASE_KEY = 'sb_publishable_iaBd03vrVGP-NxntLO9dzg_enTfgPHa';
var MOTS_REPERE_PARTI_PRIS = 800;   /* ordre de grandeur visé */
var MOTS_MAX_PARTI_PRIS = 1000;     /* au-delà, le dépôt est bloqué */
var SEPARATEUR = ' — ';             /* entre deux mesures d'une même case (ajouté par la base) */

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var app = $('app');

if(!window.supabase){
  app.innerHTML = '<div class="note err" style="margin-top:30px">La page n\'a pas pu charger ses outils (bibliothèque Supabase). Vérifiez votre connexion, ou un bloqueur de contenu, puis rechargez.</div>';
  return;
}
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var CIRCUITS = [
  { id:'analyse',    droit:'analyses',    nom:'Analyse' },
  { id:'parti pris', droit:'partis_pris', nom:'Parti pris' },
  { id:'verbatim',   droit:'verbatims',   nom:'Verbatim' }
];
var S = {
  session:null, profil:null, tab:null,
  themes:[], sujets:[], sujetById:{}, candidats:[], sources:[], srcById:{}, figById:{},
  pseudos:{}, form:null, nAttente:0, nSignal:0, nDocs:0, message:null,
  progCand:null, progDoc:null, progTheme:'', progSansDoc:true,   /* onglet Programmes */
  filtreValider:null,  /* 'tous', 'autres', 'moi' ou l'identifiant d'un déposant */
  nReprendre:0,        /* mes dépôts refusés, pas encore redéposés */
  mes:null             /* filtres de l'onglet « Mes dépôts » */
};
/* Filtres de « Mes dépôts », retenus par ce navigateur (sauf la recherche). */
var CLE_MES = 'comparateur2027-filtres-mes-depots';
function lireFiltresMes(){
  var d = { statut:'tous', circuit:'', theme:'', tri:'recent', q:'', n:30 };
  try { var v = JSON.parse(localStorage.getItem(CLE_MES) || 'null'); if(v) ['statut', 'circuit', 'theme', 'tri'].forEach(function(k){ if(typeof v[k] === 'string') d[k] = v[k]; }); } catch(e){}
  return d;
}
function garderFiltresMes(){ var m = S.mes; try { localStorage.setItem(CLE_MES, JSON.stringify({ statut:m.statut, circuit:m.circuit, theme:m.theme, tri:m.tri })); } catch(e){} }
/* Le filtre de l'onglet « À valider » est retenu par ce navigateur. */
var CLE_FILTRE = 'comparateur2027-filtre-valider';
function lireFiltre(){ try { return localStorage.getItem(CLE_FILTRE) || 'tous'; } catch(e){ return 'tous'; } }
function garderFiltre(v){ S.filtreValider = v; try { localStorage.setItem(CLE_FILTRE, v); } catch(e){} }

/* ===== Outils ===== */
function msgErreur(e){
  var m = (e && (e.message || e.error_description)) || String(e);
  if(/Failed to fetch|NetworkError/i.test(m)) return 'Connexion impossible avec la base. Réessayez dans un instant.';
  if(/row-level security|permission denied/i.test(m)) return 'Votre compte n\'a pas le droit de faire cette action.';
  return m;
}
/* Lit toutes les lignes d'une requête, par pages de 1000 (limite de l'API). */
async function tout(fabrique){
  var out = [], pas = 1000;
  for(var i = 0; ; i += pas){
    var r = await fabrique().range(i, i + pas - 1);
    if(r.error) throw r.error;
    out = out.concat(r.data);
    if(r.data.length < pas) break;
  }
  return out;
}
async function rpc(nom, args){
  var r = await sb.rpc(nom, args || {});
  if(r.error) throw r.error;
  return r.data;
}
function dateFr(iso){
  if(!iso) return '';
  var d = new Date(iso);
  return d.toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'}) + ' à ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}
function nomCircuit(id){ var c = CIRCUITS.filter(function(x){ return x.id === id; })[0]; return c ? c.nom : id; }
/* Sujets d'une thématique : ceux dont c'est l'onglet d'origine, puis ceux d'autres onglets
   qui s'y affichent aussi (colonne « Aussi dans »). Un sujet n'a qu'une case par candidat,
   quel que soit l'onglet par lequel on y arrive. */
function sujetsDeTheme(t){
  var propres = S.sujets.filter(function(s){ return s.thematique === t; });
  var empruntes = S.sujets.filter(function(s){ return s.thematique !== t && (s.aussi_dans || []).indexOf(t) >= 0; })
    .sort(function(a, b){ return a.libelle.localeCompare(b.libelle, 'fr'); });
  return { propres:propres, empruntes:empruntes };
}
function optionsSujets(t, choisi){
  var g = sujetsDeTheme(t);
  var opt = function(s, autre){ return '<option value="' + esc(s.id) + '"' + (s.id === choisi ? ' selected' : '') + '>' + esc(s.libelle) + (autre ? ' (sujet de l\'onglet ' + esc(s.thematique) + ')' : '') + '</option>'; };
  return '<option value="">— choisir —</option>'
    + g.propres.map(function(s){ return opt(s, false); }).join('')
    + (g.empruntes.length ? '<optgroup label="Sujets d\'autres onglets, affichés aussi ici">' + g.empruntes.map(function(s){ return opt(s, true); }).join('') + '</optgroup>' : '');
}
function noteSujet(id, theme){
  var s = S.sujetById[id];
  if(!s) return '';
  var emprunte = theme && s.thematique !== theme;
  var autres = [s.thematique].concat(s.aussi_dans || []).filter(function(x){ return x !== theme && !(emprunte && x === s.thematique); });
  var h = 'ID : ' + esc(s.id) + '.';
  if(emprunte) h += ' Sujet de l\'onglet « ' + esc(s.thematique) + ' », affiché aussi ici : il n\'a qu\'une case par candidat, le dépôt y va directement.';
  if(autres.length) h += ' Il s\'affiche aussi dans : ' + autres.map(esc).join(', ') + '.';
  if(emprunte || autres.length) h += ' Ne déposez pas le même texte dans un autre sujet de ces onglets.';
  return h;
}
function libelleSujet(id){ var s = S.sujetById[id]; return s ? s.libelle + ' (' + s.thematique + ')' : id; }
function flash(type, texte){ S.message = {type:type, texte:texte}; }
function prendreFlash(){ var m = S.message; S.message = null; return m ? '<div class="note ' + m.type + '">' + esc(m.texte) + '</div>' : ''; }

/* Fenêtre de confirmation, avec ou sans motif à saisir. Renvoie null si annulé. */
function demander(o){
  return new Promise(function(resolve){
    var d = $('dlg');
    d.innerHTML = '<h2>' + esc(o.titre) + '</h2>' + (o.texte ? '<p>' + esc(o.texte) + '</p>' : '')
      + (o.motif ? '<div class="field"><label for="dlgMotif">' + esc(o.motif) + '</label><textarea id="dlgMotif" class="court"></textarea></div><div class="note err hidden" id="dlgErr">Ce champ est obligatoire.</div>' : '')
      + '<div class="actions"><button class="btn ' + (o.danger ? 'danger' : 'pri') + '" id="dlgOk">' + esc(o.ok || 'Confirmer') + '</button><button class="btn" id="dlgNon">Annuler</button></div>';
    var fin = function(v){ d.close(); resolve(v); };
    $('dlgNon').onclick = function(){ fin(null); };
    d.oncancel = function(){ resolve(null); };
    $('dlgOk').onclick = function(){
      if(!o.motif) return fin(true);
      var v = $('dlgMotif').value.trim();
      if(!v && !o.motifFacultatif){ $('dlgErr').classList.remove('hidden'); return; }
      fin(v || '');
    };
    d.showModal();
  });
}

/* ===== Rendu d'un texte (aperçu et relecture) ===== */
function rendreTexte(texte, sourcesIds, classe){
  if(classe === 'verb') return '<div class="texte verb">' + esc(texte) + '</div>';
  var h = String(texte || '').split(/\r?\n+/).map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
    var fm = l.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
    if(fm){
      var f = S.figById[fm[1]];
      if(!f) return '<figure>Figure « ' + esc(fm[1]) + ' » introuvable.</figure>';
      if(f.type === 'image') return '<figure><img src="' + esc(f.url || 'figures/' + f.fichier) + '" alt="' + esc(f.alt) + '"><b>' + esc(f.titre) + '</b><br>Source : ' + esc(f.credit) + '</figure>';
      return '<figure>Graphique « ' + esc(f.titre) + ' » — dessiné par le site.</figure>';
    }
    return '<p>' + esc(l).replace(/\[(\d+)\]/g, '<sup>[$1]</sup>') + '</p>';
  }).join('');
  var out = '<div class="texte ' + (classe || '') + '">' + h + '</div>';
  if(sourcesIds && sourcesIds.length){
    out += '<ol class="srcs">' + sourcesIds.map(function(id){
      var b = S.srcById[id];
      if(!b) return '<li>' + esc(id) + '</li>';
      return '<li>' + esc(b.auteurs ? b.auteurs + '. ' : '') + '<i>' + esc(b.titre) + '</i>' + (b.organisme ? ', ' + esc(b.organisme) : '') + (b.date_publication ? ', ' + esc(b.date_publication) : '')
        + (/^https?:\/\//i.test(b.url) ? ' — <a href="' + esc(b.url) + '" target="_blank" rel="noopener">ouvrir ↗</a>' : '') + '</li>';
    }).join('') + '</ol>';
  }
  return out;
}
function compterMots(texte){
  var t = String(texte || '').split(/\r?\n/).filter(function(l){ return !/^\s*\{\{[^}]*\}\}\s*$/.test(l); }).join(' ').replace(/\[\d+\]/g, ' ');
  var m = t.match(/[^\s«»"“”().,;:!?…—–-]+/g);
  return m ? m.length : 0;
}

/* ===== Connexion ===== */
function ecranConnexion(erreur){
  $('who').innerHTML = '';
  app.innerHTML = '<h1>Espace des contributeurs</h1>'
    + '<p>Cette page sert à déposer les textes validés sur le Discord du projet : analyses, partis pris et verbatims. Un mainteneur vérifie ensuite que le circuit a été respecté, puis le texte paraît sur le site.</p>'
    + (erreur ? '<div class="note err">' + esc(erreur) + '</div>' : '')
    + '<div class="card"><p>La connexion se fait avec votre compte Discord. Seul votre pseudo Discord est utilisé ici.</p><button class="btn pri" id="btnDiscord">Se connecter avec Discord</button></div>'
    + '<p class="muted">Lire le site ne demande aucun compte : <a href="index.html">retour au comparateur</a>.</p>';
  $('btnDiscord').onclick = async function(){
    var r = await sb.auth.signInWithOAuth({ provider:'discord', options:{ redirectTo: location.origin + location.pathname } });
    if(r.error) ecranConnexion(msgErreur(r.error));
  };
}

async function demarrer(session){
  S.session = session;
  if(!session){
    var p = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ''));
    ecranConnexion(p.get('error_description') || h.get('error_description'));
    return;
  }
  try {
    var r = await sb.from('profils').select('*').eq('id', session.user.id).maybeSingle();
    if(r.error) throw r.error;
    S.profil = r.data;
  } catch(e){ app.innerHTML = '<div class="note err" style="margin-top:30px">' + esc(msgErreur(e)) + '</div>'; return; }

  $('who').innerHTML = '<span>' + esc(S.profil ? S.profil.pseudo : '') + '</span><button class="btn small" id="btnOut">Se déconnecter</button>';
  $('btnOut').onclick = function(){ sb.auth.signOut(); };

  var p = S.profil;
  if(!p || !(p.analyses || p.partis_pris || p.verbatims || p.mainteneur || p.veille)){
    app.innerHTML = '<h1>Compte en attente</h1><div class="card"><p>Votre compte est créé' + (p ? ' sous le pseudo <b>' + esc(p.pseudo) + '</b>' : '') + ', mais aucun circuit ne lui est encore attribué.</p><p>Prévenez un mainteneur sur le Discord : il ouvrira vos droits, puis rechargez cette page.</p></div>';
    return;
  }
  try { await chargerReferentiel(); }
  catch(e){ app.innerHTML = '<div class="note err" style="margin-top:30px">' + esc(msgErreur(e)) + '</div>'; return; }
  S.tab = circuitsPermis().length ? 'deposer' : S.profil.mainteneur ? 'valider' : 'programmes';
  afficher();
}

function circuitsPermis(){ return CIRCUITS.filter(function(c){ return S.profil[c.droit]; }); }

async function chargerReferentiel(){
  var r = await Promise.all([
    tout(function(){ return sb.from('thematiques').select('nom,ordre').order('ordre'); }),
    tout(function(){ return sb.from('sujets').select('id,libelle,thematique,ordre,aussi_dans').order('ordre'); }),
    tout(function(){ return sb.from('candidats').select('nom,ordre').order('ordre'); }),
    tout(function(){ return sb.from('sources').select('id,registre,auteurs,titre,organisme,date_publication,url,date_consultation,archive,statut,motif,cree_par,traite_le').order('ordre'); }),
    tout(function(){ return sb.from('figures').select('id,type,titre,alt,credit,url,fichier').order('id'); })
  ]);
  S.themes = r[0].map(function(t){ return t.nom; });
  S.sujets = r[1]; S.sujetById = {};
  S.sujets.forEach(function(s){ S.sujetById[s.id] = s; });
  S.candidats = r[2].map(function(c){ return c.nom; });
  S.sources = r[3]; S.srcById = {};
  S.sources.forEach(function(b){ S.srcById[b.id] = b; });
  S.figById = {};
  r[4].forEach(function(f){ S.figById[f.id] = f; });
  if(S.profil.mainteneur) await chargerCompteurs();
  if(circuitsPermis().length) await compterAReprendre();
}
/* Dépôts refusés que je n'ai pas encore redéposés : signalés sur l'onglet « Mes dépôts ». */
async function compterAReprendre(){
  try {
    var l = await tout(function(){ return sb.from('depots').select('id,statut,suite_de').eq('depose_par', S.session.user.id).order('id'); });
    S.nReprendre = aReprendre(l).length;
  } catch(e){ S.nReprendre = 0; }
}
function aReprendre(liste){
  var repris = {};
  liste.forEach(function(d){ if(d.suite_de) repris[d.suite_de] = 1; });
  return liste.filter(function(d){ return d.statut === 'refusé' && !repris[d.id]; });
}
function majOngletMes(){
  document.querySelectorAll('.tab[data-tab="mes"]').forEach(function(t){ t.innerHTML = 'Mes dépôts' + (S.nReprendre ? '<span class="n alerte" title="Dépôts refusés à reprendre">' + S.nReprendre + '</span>' : ''); });
}
async function chargerCompteurs(){
  var a = await sb.from('depots').select('id', {count:'exact', head:true}).eq('statut', 'en attente');
  var b = await sb.from('signalements').select('id', {count:'exact', head:true}).eq('traite', false);
  S.nAttente = a.count || 0; S.nSignal = b.count || 0;
  S.nDocs = S.sources.filter(function(x){ return x.registre === 'programme' && x.statut === 'en attente'; }).length;
  var p = await tout(function(){ return sb.from('profils').select('id,pseudo'); });
  S.pseudos = {};
  p.forEach(function(x){ S.pseudos[x.id] = x.pseudo; });
}

/* ===== Onglets ===== */
function afficher(){
  var onglets = [];
  if(circuitsPermis().length){ onglets.push(['deposer', 'Déposer']); onglets.push(['mes', 'Mes dépôts' + (S.nReprendre ? '<span class="n alerte" title="Dépôts refusés à reprendre">' + S.nReprendre + '</span>' : '')]); }
  if(S.profil.mainteneur){
    onglets.push(['valider', 'À valider' + (S.nAttente ? '<span class="n">' + S.nAttente + '</span>' : '')]);
    onglets.push(['enligne', 'En ligne']);
    onglets.push(['signalements', 'Signalements' + (S.nSignal ? '<span class="n">' + S.nSignal + '</span>' : '')]);
  }
  if(S.profil.veille || S.profil.mainteneur) onglets.push(['programmes', 'Programmes' + (S.profil.mainteneur && S.nDocs ? '<span class="n">' + S.nDocs + '</span>' : '')]);
  if(S.profil.mainteneur){
    onglets.push(['droits', 'Droits']);
    onglets.push(['excel', 'Excel']);
  }
  app.innerHTML = '<nav class="tabs">' + onglets.map(function(o){

  }).join('') + '</nav><div id="vue"></div>';
  app.querySelectorAll('.tab').forEach(function(b){ b.onclick = function(){ S.tab = b.getAttribute('data-tab'); afficher(); }; });
  var vues = { deposer:vueDeposer, mes:vueMes, valider:vueValider, enligne:vueEnLigne, signalements:vueSignalements, programmes:vueProgrammes, droits:vueDroits, excel:vueExcel };
  Promise.resolve(vues[S.tab]()).catch(function(e){ $('vue').innerHTML = '<div class="note err">' + esc(msgErreur(e)) + '</div>'; });
}

/* =====================================================================
   DÉPOSER
   ===================================================================== */
function nouveauFormulaire(circuit){
  return { circuit:circuit, theme:'', sujet:'', candidat:'', auteur:'', initiales:'', age:'', texte:'',
           sources:[], relecteurs:['', ''], remplace:null, suite_de:null, ctx:null, motifPrecedent:null,
           mode:null, ancienTexte:null, docs:[], docsOuvert:false };
}
function relecteursRequis(f){ return (f.circuit === 'verbatim' || f.remplace || f.suite_de) ? 1 : 2; }

/* Ce qui existe déjà à l'endroit visé : la case en ligne (verbatim) ou les textes
   du sujet (analyse, parti pris). Chargé à part, sans redessiner le formulaire,
   pour ne jamais interrompre la saisie. */
var jetonContexte = 0;
async function majContexte(){
  var f = S.form, zone = $('ctxZone');
  if(!zone) return;
  if(!f.ctx){
    zone.innerHTML = '';
    if(!f.sujet || (f.circuit === 'verbatim' && !f.candidat)) return;
    var jeton = ++jetonContexte, ctx = { existants:[], position:null };
    try {
      if(f.circuit === 'verbatim'){
        var r = await sb.from('positions').select('texte').eq('sujet_id', f.sujet).eq('candidat', f.candidat).maybeSingle();
        if(r.error) throw r.error;
        ctx.position = r.data ? r.data.texte : null;
        /* Documents déjà rattachés à cette case. Une erreur ici ne bloque rien. */
        var l = await sb.from('cases_sources').select('source_id').eq('sujet_id', f.sujet).eq('candidat', f.candidat);
        ctx.lies = (!l.error && l.data) ? l.data.map(function(x){ return x.source_id; }) : [];
      } else {
        var e = await sb.from('editorial').select('*').eq('sujet_id', f.sujet).eq('type', f.circuit).order('id');
        if(e.error) throw e.error;
        ctx.existants = e.data;
      }
    } catch(err){
      if(jeton === jetonContexte && $('ctxZone')) $('ctxZone').innerHTML = '<div class="note err">' + esc(msgErreur(err)) + '</div>';
      return;
    }
    if(jeton !== jetonContexte || S.form !== f) return;   /* une demande plus récente a pris le relais */
    f.ctx = ctx;
    zone = $('ctxZone');
    if(!zone) return;
  }
  var h = '';
  if(f.circuit === 'verbatim' && f.ctx.position != null){
    h = '<div class="note info"><b>Cette case contient déjà un texte en ligne :</b>' + rendreTexte(f.ctx.position, null, 'verb')
      + '<span class="lab" style="margin-top:10px">Votre dépôt…</span>'
      + '<label class="choix"><input type="radio" name="fMode" value="ajout"' + (f.mode === 'ajout' ? ' checked' : '') + '><span><b>s\'ajoute à la suite.</b> Saisissez seulement la ou les nouvelles mesures. À la validation, la base les placera après « — », à la suite du texte alors en ligne, même si un autre ajout a été validé entre-temps.</span></label>'
      + '<label class="choix"><input type="radio" name="fMode" value="remplacement"' + (f.mode === 'remplacement' ? ' checked' : '') + '><span><b>corrige le texte en ligne.</b> Le texte en ligne est repris dans le champ ci-dessous : modifiez-le. Si la case change avant la validation, votre correction ne pourra pas être publiée et devra être refaite.</span></label>'
      + '</div>';
  } else if(f.circuit === 'verbatim'){
    h = '<p class="muted">Cette case est vide : votre texte la remplira.</p>';
  } else if(f.ctx.existants.length){
    h = '<div class="field"><label for="fRemplace">Nouveau texte ou correction ?</label><select id="fRemplace"><option value="">Nouveau texte, qui s\'ajoute</option>'
      + f.ctx.existants.map(function(e){ return '<option value="' + e.id + '"' + (f.remplace === e.id ? ' selected' : '') + '>Correction du texte de ' + esc(e.auteur || '?') + (e.publie ? '' : ' (dépublié)') + ' — « ' + esc(e.texte.slice(0, 50)) + '… »</option>'; }).join('')
      + '</select><small>Une correction remplace le texte en ligne, sans mention visible. Une seule validation sur Discord suffit.</small></div>';
  }
  if(f.ancienTexte != null) h += '<details><summary>Pour mémoire : le texte de votre dépôt refusé</summary><div>' + rendreTexte(f.ancienTexte, null, 'verb') + '</div></details>';
  zone.innerHTML = h;
  majDocs();
  /* Correction (y compris après un refus) : on part toujours du texte en ligne. */
  if(f.circuit === 'verbatim' && f.ctx.position != null && f.mode === 'remplacement' && !f.texte.trim()){
    f.texte = f.ctx.position;
    if($('fTexte')) $('fTexte').value = f.texte;
  }
  zone.querySelectorAll('input[name="fMode"]').forEach(function(r){
    r.onchange = function(){
      f.mode = this.value;
      if(f.mode === 'remplacement' && !f.texte.trim()) f.texte = f.ctx.position;
      if(f.mode === 'ajout' && f.texte === f.ctx.position) f.texte = '';
      $('fTexte').value = f.texte;
      majDiagnostic();
    };
  });
  if($('fRemplace')) $('fRemplace').onchange = function(){
    f.remplace = this.value ? parseInt(this.value, 10) : null;
    if(f.remplace){
      var e = f.ctx.existants.filter(function(x){ return x.id === f.remplace; })[0];
      f.texte = e.texte; f.auteur = e.auteur; f.initiales = e.initiales; f.age = e.age || ''; f.sources = e.sources.slice();
    }
    vueDeposer();
  };
  majDiagnostic();
}

function diagnostics(f){
  var avert = [], bloc = [], t = f.texte;
  if(!f.sujet) bloc.push('Choisissez un sujet.');
  if(!t.trim()) bloc.push('Le texte est vide.');
  var relus = f.relecteurs.slice(0, relecteursRequis(f)).map(function(x){ return x.trim(); }).filter(Boolean);
  var distincts = relus.filter(function(x, i){ return relus.indexOf(x) === i; });
  if(distincts.length < relecteursRequis(f)) bloc.push(relecteursRequis(f) === 2 ? 'Indiquez les deux relecteurs (deux personnes différentes).' : 'Indiquez le relecteur.');

  if(f.circuit === 'verbatim'){
    if(!f.candidat) bloc.push('Choisissez un candidat.');
    if(f.sujet && f.candidat){
      if(!f.ctx) bloc.push('Vérification du contenu de la case en cours : réessayez dans un instant.');
      else if(f.ctx.position != null){
        var tt = t.trim();
        if(!f.mode) bloc.push('Indiquez si votre texte s\'ajoute à la case ou corrige le texte en ligne.');
        else if(f.mode === 'remplacement' && tt === f.ctx.position) bloc.push('Le texte est identique au texte en ligne : il n\'y a rien à corriger.');
        else if(f.mode === 'ajout'){
          if(tt && f.ctx.position.indexOf(tt) >= 0) avert.push('Ce texte figure déjà dans la case en ligne : vérifiez qu\'il ne s\'agit pas d\'un doublon.');
          if(/^—/.test(tt)) avert.push('Inutile de commencer par « — » : la base l\'ajoute elle-même entre le texte en ligne et le vôtre.');
        }
      }
    }
    if(/\[\s*…\s*\]|\(\s*(\.\.\.|…)\s*\)|\[\s*\.\.\s*\]|\[\s*\.{4,}\s*\]|\[\s+\.\.\.\s*\]|\[\.\.\.\s+\]/.test(t)) avert.push('Une coupe se note [...] : crochets droits et trois points saisis au clavier.');
    if(/\[\s*sic\s*\]/i.test(t)) avert.push('Pas de [sic] : une coquille du programme est reproduite telle quelle.');
    var crochets = (t.match(/\[[^\]]*\]/g) || []).filter(function(c){ return c !== '[...]' && !/^\[\s*(…|\.+)\s*\]$/.test(c) && !/^\[\s*sic\s*\]$/i.test(c); });
    if(crochets.length) avert.push('Aucun mot ne s\'ajoute entre crochets (' + crochets.slice(0, 2).join(', ') + ') : ils signalent seulement une coupe.');
    if(/^\s*[«"“]/.test(t) && /[»"”]\s*$/.test(t)) avert.push('Inutile d\'entourer le texte de guillemets : le site les ajoute.');
    if(/\n/.test(t.trim())) avert.push('Plusieurs mesures dans une même case se séparent par « — » (tiret cadratin entouré d\'espaces), sans retour à la ligne.');
  } else {
    if(!f.auteur.trim()) bloc.push(f.circuit === 'parti pris' ? 'Indiquez le pseudonyme ou les initiales de l\'auteur.' : 'Indiquez l\'auteur.');
    var appels = (t.match(/\[(\d+)\]/g) || []).map(function(a){ return parseInt(a.slice(1), 10); });
    var max = appels.length ? Math.max.apply(null, appels) : 0;
    if(max > f.sources.length) avert.push('Le texte appelle la note [' + max + '] mais seulement ' + f.sources.length + ' source(s) sont listées.');
    f.sources.forEach(function(id, i){ if(appels.indexOf(i + 1) < 0) avert.push('La source ' + (i + 1) + ' n\'est appelée par aucune note [' + (i + 1) + '] dans le texte.'); });
    t.split(/\r?\n/).forEach(function(l){
      if(l.indexOf('{{') < 0) return;
      var m = l.match(/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/);
      if(!m) avert.push('Un appel de figure {{…}} doit être seul sur sa ligne.');
      else if(!S.figById[m[1]]) avert.push('La figure « ' + m[1] + ' » n\'existe pas.');
    });
    if(f.circuit === 'analyse' && !f.sources.length) avert.push('Une analyse est sourcée : aucune source n\'est listée.');
    if(f.circuit === 'parti pris'){
      var age = parseInt(f.age, 10);
      if(!(age >= 18)) bloc.push('Indiquez l\'âge de l\'auteur (18 ans au moins).');
      var n = compterMots(t);
      if(n > MOTS_MAX_PARTI_PRIS) bloc.push('Le texte compte ' + n + ' mots : la limite est de ' + MOTS_MAX_PARTI_PRIS + ', notes non comprises.');
      else if(n > MOTS_REPERE_PARTI_PRIS) avert.push('Le texte compte ' + n + ' mots : l\'ordre de grandeur visé est de ' + MOTS_REPERE_PARTI_PRIS + ' (blocage au-delà de ' + MOTS_MAX_PARTI_PRIS + ').');
      var bas = ' ' + t.toLowerCase() + ' ';
      S.candidats.forEach(function(c){
        var nom = c.trim().split(/\s+/).pop().toLowerCase();
        if(nom.length > 3 && !/^candidat/i.test(c) && bas.indexOf(nom) >= 0) avert.push('Le texte semble nommer un candidat (« ' + c + ' ») : un parti pris parle des idées, pas des personnes.');
      });
    }
  }
  return { avert:avert, bloc:bloc };
}

  if(!S.form || !S.profil[CIRCUITS.filter(function(c){ return c.id === S.form.circuit; })[0].droit]) S.form = nouveauFormulaire(permis[0].id);

    + (estVerb ? '<div class="field"><label for="fCand">Candidat</label><select id="fCand"><option value="">— choisir —</option>' + S.candidats.map(function(c){ return '<option' + (c === f.candidat ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></div>' : '')

  } else {
    h += '<div class="row"><div class="field"><label for="fAuteur">' + (estPP ? 'Pseudonyme ou initiales de l\'auteur (publié)' : 'Auteur') + '</label><input type="text" id="fAuteur" maxlength="60" value="' + esc(f.auteur) + '">' + (estPP ? '<small>Ni le vrai nom, ni une référence à un candidat, un parti ou une personnalité.</small>' : '') + '</div>'

      + (estPP ? '<div class="field narrow"><label for="fAge">Âge</label><input type="number" id="fAge" min="18" max="120" value="' + esc(f.age) + '"></div>' : '')
      + '</div>'
      + '<div class="field"><label for="fTexte">Texte validé sur Discord</label><textarea id="fTexte">' + esc(f.texte) + '</textarea>'
      + (estPP ? '<div class="compte" id="compte"></div>' : '')
      + '<small>Un paragraphe par ligne. Les notes s\'écrivent [1], [2]… et renvoient aux sources ci-dessous, dans l\'ordre.</small></div>';

    h += '<h3>Sources, dans l\'ordre des notes</h3><div id="listeSources"></div>'
      + '<details id="detSrc"><summary>Ajouter une source</summary><div>'
      + '<div class="field"><label for="srcCherche">Chercher dans la bibliographie</label><input type="search" id="srcCherche" placeholder="Titre, auteur, organisme ou adresse…"><div class="results" id="srcResultats"></div></div>'
      + '<p class="muted">Elle n\'y est pas ? Créez-la :</p>'
      + '<div class="row"><div class="field"><label for="nsTitre">Titre</label><input type="text" id="nsTitre"></div><div class="field"><label for="nsAuteurs">Auteurs</label><input type="text" id="nsAuteurs"></div></div>'

      + '<div class="row"><div class="field"><label for="nsDate">Date de publication</label><input type="text" id="nsDate" placeholder="2026"></div><div class="field"><label for="nsUrl">Adresse web</label><input type="url" id="nsUrl" placeholder="https://…"></div></div>'
      + '<button class="btn" id="btnCreerSrc">Créer et ajouter cette source</button><div id="srcMsg"></div></div></details>';

    h += '<details id="detImg"><summary>Insérer une image (infographie)</summary><div>'

      + '<div class="row"><div class="field"><label for="imgTitre">Titre de la figure</label><input type="text" id="imgTitre"></div><div class="field"><label for="imgCredit">Source des données (obligatoire)</label><input type="text" id="imgCredit" placeholder="Ex. Insee, comptes nationaux 2025"></div></div>'

  h += '</div>';
  h += '</div>';

  h += '<div id="diag"></div><div class="actions"><button class="btn pri" id="btnDeposer">Déposer pour validation</button><button class="btn" id="btnApercu">Aperçu</button><button class="btn" id="btnVider">Tout effacer</button></div><div id="apercu"></div>';
  vue.innerHTML = h;

  /* --- liaisons --- */
  vue.querySelectorAll('.pill').forEach(function(b){ b.onclick = function(){ var anc = S.form; S.form = nouveauFormulaire(b.getAttribute('data-circuit')); S.form.theme = anc.theme; S.form.sujet = anc.sujet; vueDeposer(); }; });
  $('fTheme').onchange = function(){ f.theme = this.value; f.sujet = ''; f.ctx = null; f.remplace = null; f.mode = null; vueDeposer(); };

  if($('fCand')) $('fCand').onchange = function(){ f.candidat = this.value; f.ctx = null; f.mode = null; f.docs = []; vueDeposer(); };
  var maj = function(){ majDiagnostic(); };
  $('fTexte').oninput = function(){ f.texte = this.value; maj(); };
  if($('fAuteur')) $('fAuteur').oninput = function(){ f.auteur = this.value; maj(); };
  if($('fInit')) $('fInit').oninput = function(){ f.initiales = this.value; };
  if($('fAge')) $('fAge').oninput = function(){ f.age = this.value; maj(); };
  [0, 1].forEach(function(i){ if($('fRel' + i)) $('fRel' + i).oninput = function(){ f.relecteurs[i] = this.value; maj(); }; });
  $('btnVider').onclick = function(){ S.form = nouveauFormulaire(f.circuit); vueDeposer(); };
  $('btnApercu').onclick = function(){
    var ajoutVerb = estVerb && f.ctx && f.ctx.position != null && f.mode === 'ajout';
    $('apercu').innerHTML = '<h3>' + (ajoutVerb ? 'Aperçu de la case après validation' : 'Aperçu') + '</h3>'
      + rendreTexte(ajoutVerb ? f.ctx.position + SEPARATEUR + f.texte.trim() : f.texte, estVerb ? null : f.sources, estVerb ? 'verb' : (estPP ? 'pp' : ''));
  };
  $('btnDeposer').onclick = deposer;
  if(!estVerb){ majSources(); lierSources(); lierImage(); }
  majDiagnostic();
  majDocs();
  majContexte();
}

/* Documents du corpus dont un verbatim est tiré : à cocher au dépôt, facultatif.
   Rien n'est vérifié à la validation, et ces liens ne s'affichent pas sur le site. */
function docsDuCandidat(c){
  return S.sources.filter(function(b){ return b.registre === 'programme' && b.auteurs === c && (b.statut === 'publié' || b.statut === 'en attente'); });
}
function titreDocs(f){ var n = f.docs.length; return 'Document(s) d\'où vient ce texte — facultatif' + (n ? ' (' + n + ' coché' + (n > 1 ? 's' : '') + ')' : ''); }
function majDocs(){
  var f = S.form, z = $('docsZone');
  if(!z) return;
  var docs = (f.circuit === 'verbatim' && f.candidat) ? docsDuCandidat(f.candidat) : [];
  if(!docs.length){ z.innerHTML = ''; return; }
  var lies = (f.ctx && f.ctx.lies) || [];
  z.innerHTML = '<details id="detDocs"' + (f.docsOuvert ? ' open' : '') + '><summary>' + esc(titreDocs(f)) + '</summary><div>'
    + '<p class="muted">Si vous le savez, cochez le ou les documents du corpus dont ce texte est tiré. Ce n\'est ni obligatoire ni vérifié à la validation, et ces liens ne s\'affichent pas sur le site.</p>'
    + docs.map(function(b){
        var deja = lies.indexOf(b.id) >= 0;
        return '<label class="choix"><input type="checkbox" data-doc="' + esc(b.id) + '"' + (deja || f.docs.indexOf(b.id) >= 0 ? ' checked' : '') + (deja ? ' disabled' : '') + '><span>' + esc(b.titre)
          + (b.statut === 'en attente' ? ' <span class="badge attente">en attente</span>' : '') + (deja ? ' <span class="muted">— déjà rattaché à cette case</span>' : '') + '</span></label>';
      }).join('')
    + '</div></details>';
  $('detDocs').ontoggle = function(){ f.docsOuvert = this.open; };
  z.querySelectorAll('input[data-doc]').forEach(function(c){
    c.onchange = function(){
      var id = c.getAttribute('data-doc'), i = f.docs.indexOf(id);
      if(c.checked && i < 0) f.docs.push(id);
      if(!c.checked && i >= 0) f.docs.splice(i, 1);
      $('detDocs').querySelector('summary').textContent = titreDocs(f);
    };
  });
}

function majDiagnostic(){
  var f = S.form, d = diagnostics(f), h = '';
  if(d.avert.length) h += '<div class="note warn"><b>À vérifier avant de déposer</b><ul>' + d.avert.map(function(a){ return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></div>';
  if($('diag')) $('diag').innerHTML = h;
  if($('compte')){
    var n = compterMots(f.texte);
    $('compte').textContent = n + ' mots — repère : ' + MOTS_REPERE_PARTI_PRIS + ', maximum : ' + MOTS_MAX_PARTI_PRIS + ' (notes non comptées)';
    $('compte').className = 'compte' + (n > MOTS_MAX_PARTI_PRIS ? ' trop' : '');
  }
}

function majSources(){
  var f = S.form, w = $('listeSources');
  if(!w) return;
  if(!f.sources.length){ w.innerHTML = '<p class="muted">Aucune source pour l\'instant.</p>'; return; }
  w.innerHTML = f.sources.map(function(id, i){
    var b = S.srcById[id] || { titre:id };
    return '<div class="srcline"><span class="num">[' + (i + 1) + ']</span><span class="t"><b>' + esc(b.titre) + '</b>' + (b.auteurs || b.organisme ? '<br><span class="muted">' + esc([b.auteurs, b.organisme, b.date_publication].filter(Boolean).join(' — ')) + '</span>' : '') + '</span>'
      + '<button class="btn small" data-act="haut" data-i="' + i + '"' + (i ? '' : ' disabled') + ' aria-label="Monter">↑</button>'
      + '<button class="btn small" data-act="bas" data-i="' + i + '"' + (i < f.sources.length - 1 ? '' : ' disabled') + ' aria-label="Descendre">↓</button>'
      + '<button class="btn small danger" data-act="oter" data-i="' + i + '">Retirer</button></div>';
  }).join('');
  w.querySelectorAll('button').forEach(function(b){
    b.onclick = function(){
      var i = parseInt(b.getAttribute('data-i'), 10), a = b.getAttribute('data-act'), s = f.sources;
      if(a === 'oter') s.splice(i, 1);
      else { var j = a === 'haut' ? i - 1 : i + 1; var tmp = s[i]; s[i] = s[j]; s[j] = tmp; }
      majSources(); majDiagnostic();
    };
  });
}
function ajouterSource(id){
  var f = S.form;
  if(f.sources.indexOf(id) < 0) f.sources.push(id);
  majSources(); majDiagnostic();
}
function lierSources(){
  var champ = $('srcCherche'), res = $('srcResultats');
  champ.oninput = function(){
    var q = champ.value.trim().toLowerCase();
    if(q.length < 2){ res.innerHTML = ''; return; }
    var hits = S.sources.filter(function(b){ return (b.titre + ' ' + b.auteurs + ' ' + b.organisme + ' ' + b.url + ' ' + b.id).toLowerCase().indexOf(q) >= 0; }).slice(0, 8);
    res.innerHTML = hits.length ? '' : '<p class="muted">Aucune source trouvée.</p>';
    hits.forEach(function(b){
      var bt = document.createElement('button');
      bt.innerHTML = '<b>' + esc(b.titre) + '</b><br><span class="muted">' + esc([b.auteurs, b.organisme, b.date_publication].filter(Boolean).join(' — ')) + '</span>';
      bt.onclick = function(){ ajouterSource(b.id); champ.value = ''; res.innerHTML = ''; };
      res.appendChild(bt);
    });
  };
  $('btnCreerSrc').onclick = async function(){
    var m = $('srcMsg'), bouton = this;
    var titre = $('nsTitre').value.trim(), url = $('nsUrl').value.trim();
    if(!titre){ m.innerHTML = '<div class="note err">Le titre est obligatoire.</div>'; return; }
    if(url && !/^https?:\/\//i.test(url)){ m.innerHTML = '<div class="note err">L\'adresse web doit commencer par https://</div>'; return; }
    bouton.disabled = true;
    try {
      var auj = new Date().toLocaleDateString('fr-FR');
      var id = await rpc('creer_source', { p_auteurs:$('nsAuteurs').value, p_titre:titre, p_type:$('nsType').value, p_organisme:$('nsOrg').value, p_date_publication:$('nsDate').value, p_url:url, p_date_consultation:auj });
      var deja = !!S.srcById[id];
      if(!deja){
        var b = { id:id, registre:'analyse', auteurs:$('nsAuteurs').value.trim(), titre:titre, organisme:$('nsOrg').value.trim(), date_publication:$('nsDate').value.trim(), url:url };
        S.sources.push(b); S.srcById[id] = b;
      }
      ajouterSource(id);
      ['nsTitre', 'nsAuteurs', 'nsOrg', 'nsDate', 'nsUrl'].forEach(function(k){ $(k).value = ''; });
      m.innerHTML = '<div class="note ok">' + (deja ? 'Cette adresse existait déjà dans la bibliographie : la source existante a été ajoutée.' : 'Source créée et ajoutée.') + '</div>';
    } catch(e){ m.innerHTML = '<div class="note err">' + esc(msgErreur(e)) + '</div>'; }
    bouton.disabled = false;
  };
}
function lierImage(){
  $('btnImg').onclick = async function(){
    var m = $('imgMsg'), bouton = this, fichier = $('imgFichier').files[0];
    var titre = $('imgTitre').value.trim(), alt = $('imgAlt').value.trim(), credit = $('imgCredit').value.trim();
    if(!fichier || !titre || !alt || !credit){ m.innerHTML = '<div class="note err">Le fichier, le titre, la description et la source des données sont tous obligatoires.</div>'; return; }
    if(fichier.size > 5 * 1024 * 1024){ m.innerHTML = '<div class="note err">Ce fichier dépasse 5 Mo.</div>'; return; }
    bouton.disabled = true; m.innerHTML = '<p class="muted">Envoi en cours…</p>';
    try {
      var ext = ({ 'image/png':'png', 'image/jpeg':'jpg', 'image/webp':'webp' })[fichier.type];
      if(!ext) throw new Error('Format non accepté : PNG, JPG ou WebP uniquement.');
      var chemin = S.session.user.id + '/' + Date.now() + '.' + ext;
      var up = await sb.storage.from('figures').upload(chemin, fichier, { contentType:fichier.type, cacheControl:'31536000' });
      if(up.error) throw up.error;
      var url = sb.storage.from('figures').getPublicUrl(chemin).data.publicUrl;
      var id = await rpc('creer_figure_image', { p_titre:titre, p_alt:alt, p_credit:credit, p_url:url });
      S.figById[id] = { id:id, type:'image', titre:titre, alt:alt, credit:credit, url:url };
      var ta = $('fTexte'), pos = ta.selectionStart || ta.value.length, avant = ta.value.slice(0, pos).replace(/\s*$/, ''), apres = ta.value.slice(pos).replace(/^\s*/, '');
      ta.value = (avant ? avant + '\n' : '') + '{{' + id + '}}' + (apres ? '\n' + apres : '');
      S.form.texte = ta.value;
      ['imgTitre', 'imgAlt', 'imgCredit', 'imgFichier'].forEach(function(k){ $(k).value = ''; });
      m.innerHTML = '<div class="note ok">Image envoyée. La ligne {{' + esc(id) + '}} marque sa place dans le texte : vous pouvez la déplacer.</div>';
      majDiagnostic();
    } catch(e){ m.innerHTML = '<div class="note err">' + esc(msgErreur(e)) + '</div>'; }
    bouton.disabled = false;
  };
}

async function deposer(){
  var f = S.form, d = diagnostics(f);
  if(d.bloc.length){
    $('diag').innerHTML = '<div class="note err"><b>Le dépôt n\'est pas possible en l\'état</b><ul>' + d.bloc.map(function(a){ return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></div>';
    $('diag').scrollIntoView({ block:'center' });
    return;
  }
  var estVerb = f.circuit === 'verbatim';
  /* Verbatim : ajout à la case (cas général), ou correction du texte en ligne,
     avec le texte de départ pour que la base refuse une correction devenue obsolète. */
  var mode = null, base = null;
  if(estVerb){
    if(f.ctx && f.ctx.position != null){ mode = f.mode; if(mode === 'remplacement') base = f.ctx.position; }
    else mode = 'ajout';
  }
  var ligne = {
    circuit:f.circuit, sujet_id:f.sujet, candidat:estVerb ? f.candidat : null,
    auteur:estVerb ? '' : f.auteur.trim(), initiales:estVerb ? '' : f.initiales.trim(),
    age:f.circuit === 'parti pris' ? parseInt(f.age, 10) : null,
    texte:f.texte, sources:estVerb ? f.docs.slice() : f.sources,
    relecteurs:f.relecteurs.slice(0, relecteursRequis(f)).map(function(x){ return x.trim(); }),
    remplace:estVerb ? null : f.remplace, suite_de:f.suite_de, depose_par:S.session.user.id,
    mode:mode, texte_base:base
  };
  $('btnDeposer').disabled = true;
  var r = await sb.from('depots').insert(ligne);
  if(r.error){
    $('btnDeposer').disabled = false;
    $('diag').innerHTML = '<div class="note err">' + esc(msgErreur(r.error)) + '</div>';
    return;
  }
  S.form = nouveauFormulaire(f.circuit);
  flash('ok', 'Dépôt enregistré. Il paraîtra sur le site dès qu\'un mainteneur l\'aura validé.');
  if(S.profil.mainteneur) S.nAttente++;
  S.tab = 'mes'; afficher();
}

/* =====================================================================
   MES DÉPÔTS
   ===================================================================== */
function natureDepot(d){
  if(d.circuit === 'verbatim'){
    var n = d.mode === 'ajout' ? 'Ajout à la case' : d.mode === 'remplacement' ? 'Correction de la case' : 'Remplace la case';
    return (d.suite_de ? 'Nouveau dépôt après refus · ' : '') + n;
  }
  return d.suite_de ? 'Nouveau dépôt après refus' : d.remplace ? 'Correction d\'un texte en ligne' : 'Nouveau';
}
function carteDepot(d, mode){
  var statutClasse = { 'en attente':'attente', 'publié':'publie', 'refusé':'refuse' }[d.statut];
  var estVerb = d.circuit === 'verbatim', obsolete = false;
  var h = '<div class="card' + (mode === 'mes' && d.statut === 'refusé' ? ' a-reprendre' : '') + '" data-depot="' + d.id + '">'
    + '<div><span class="badge">' + esc(nomCircuit(d.circuit)) + '</span> <span class="badge ' + statutClasse + '">' + esc(d.statut) + '</span></div>'
    + '<h2 style="margin-top:8px">' + esc(libelleSujet(d.sujet_id)) + (d.candidat ? ' — ' + esc(d.candidat) : '') + '</h2>'
    + '<div class="meta">' + (mode === 'valider' ? 'Déposé par <b>' + esc(S.pseudos[d.depose_par] || 'compte supprimé') + '</b> le ' : 'Déposé le ') + esc(dateFr(d.depose_le))
    + ' · ' + esc(natureDepot(d)) + ' · Relu par <b>' + esc(d.relecteurs.join(', ')) + '</b>'
    + (!estVerb ? ' · Auteur : <b>' + esc(d.auteur) + (d.age ? ', ' + d.age + ' ans' : '') + '</b>' : '') + '</div>'
    + (estVerb && d.sources && d.sources.length ? '<div class="meta">Document(s) d\'origine indiqué(s) : ' + d.sources.map(function(id){ return '<b>' + esc(S.srcById[id] ? S.srcById[id].titre : id) + '</b>'; }).join(', ') + '</div>' : '');
  if(d.statut === 'refusé') h += '<div class="note err"><b>Refusé</b> le ' + esc(dateFr(d.traite_le)) + ' — ' + esc(d.motif || '') + '</div>';
  if(mode === 'vu') h += '<p class="muted">Repris : un nouveau dépôt a été fait après ce refus.</p>';
  if(mode === 'valider' && d.suite_de && d._precedent) h += '<div class="note info">Fait suite à un refus — motif d\'alors : « ' + esc(d._precedent.motif || '') + ' »</div>';
  if(mode === 'valider' && estVerb && d.mode === 'remplacement'){
    obsolete = d._actuel !== d.texte_base;
    if(obsolete) h += '<div class="note err"><b>La case a changé depuis ce dépôt</b> : un autre texte y a été validé, ou elle a été dépubliée. Cette correction ne peut plus être validée. Refusez-la en demandant au déposant de repartir du texte en ligne.</div>';
  }
  h += '<details' + (mode === 'valider' ? ' open' : '') + '><summary>' + (estVerb && d.mode === 'ajout' ? 'Le texte déposé, à ajouter à la suite' : 'Le texte déposé') + '</summary><div>' + rendreTexte(d.texte, d.sources, estVerb ? 'verb' : d.circuit === 'parti pris' ? 'pp' : '') + '</div></details>';
  if(mode === 'valider' && d._actuel != null){
    if(estVerb && d.mode === 'ajout') h += '<details open><summary>La case après validation</summary><div>' + rendreTexte(d._actuel + SEPARATEUR + d.texte, null, 'verb') + '</div></details>';
    else h += '<details><summary>Le texte actuellement en ligne, qui sera remplacé</summary><div>' + rendreTexte(d._actuel, null, estVerb ? 'verb' : '') + '</div></details>';
  }
  if(mode === 'mes' && d.statut === 'refusé') h += '<div class="actions"><button class="btn" data-act="redeposer">Corriger et redéposer</button></div>';
  if(mode === 'valider'){
    var sien = d.depose_par === S.session.user.id;
    h += '<div class="actions"><button class="btn pri" data-act="valider"' + (sien || obsolete ? ' disabled' : '') + '>Valider et publier</button><button class="btn danger" data-act="refuser">Refuser…</button>'
      + (sien ? '<span class="muted">Vous avez déposé ce texte : un autre mainteneur doit le valider.</span>' : '') + '</div>';
  }
  return h + '</div>';
}

async function vueMes(){
  var vue = $('vue');
  var tete = prendreFlash();
  vue.innerHTML = tete + '<p class="muted">Chargement…</p>';
  var liste = await tout(function(){ return sb.from('depots').select('*').eq('depose_par', S.session.user.id).order('depose_le', { ascending:false }).order('id', { ascending:false }); });
  if(!S.mes) S.mes = lireFiltresMes();
  var m = S.mes;

  /* État de chaque dépôt, du point de vue du déposant. */
  var reprendre = aReprendre(liste), idsReprendre = {};
  reprendre.forEach(function(d){ idsReprendre[d.id] = 1; });
  var etat = function(d){ return idsReprendre[d.id] ? 'reprendre' : d.statut === 'refusé' ? 'repris' : d.statut === 'en attente' ? 'attente' : 'publie'; };
  var n = { tous:liste.length, reprendre:0, attente:0, publie:0, repris:0 };
  liste.forEach(function(d){ n[etat(d)]++; });
  S.nReprendre = n.reprendre; majOngletMes();
  if(m.statut !== 'tous' && !n[m.statut]) m.statut = n.reprendre ? 'reprendre' : 'tous';

  if(!liste.length){ vue.innerHTML = tete + '<p class="muted">Vous n\'avez encore rien déposé.</p>'; return; }

  var circuits = CIRCUITS.filter(function(c){ return liste.some(function(d){ return d.circuit === c.id; }); });
  var themeDe = function(d){ var x = S.sujetById[d.sujet_id]; return x ? x.thematique : ''; };
  var themes = S.themes.filter(function(t){ return liste.some(function(d){ var x = S.sujetById[d.sujet_id]; return x && (x.thematique === t || (x.aussi_dans || []).indexOf(t) >= 0); }); });
  if(m.circuit && !circuits.some(function(c){ return c.id === m.circuit; })) m.circuit = '';
  if(m.theme && themes.indexOf(m.theme) < 0) m.theme = '';

  var puce = function(k, lib, alerte){ return '<button type="button" data-statut="' + k + '" class="' + (m.statut === k ? 'on ' : '') + (alerte ? 'alerte' : '') + '">' + lib + ' (' + n[k] + ')</button>'; };
  var h = tete
    + (n.reprendre ? '<div class="note err"><b>' + n.reprendre + ' dépôt' + (n.reprendre > 1 ? 's refusés' : ' refusé') + ' à reprendre.</b> ' + (n.reprendre > 1 ? 'Ils sont affichés' : 'Il est affiché') + ' en premier. Lisez le motif, faites valider la correction sur Discord, puis cliquez « Corriger et redéposer ».</div>' : '')
    + '<div class="compteurs" role="group" aria-label="Filtrer par état">'
    + puce('tous', 'Tous') + (n.reprendre ? puce('reprendre', 'À reprendre', true) : '') + puce('attente', 'En attente') + puce('publie', 'Publiés') + (n.repris ? puce('repris', 'Refusés déjà repris') : '')
    + '</div>'
    + '<div class="filtres-mes">'
    + (circuits.length > 1 ? '<div><label for="mesCircuit">Circuit</label><select id="mesCircuit"><option value="">Tous</option>' + circuits.map(function(c){ return '<option value="' + c.id + '"' + (c.id === m.circuit ? ' selected' : '') + '>' + c.nom + '</option>'; }).join('') + '</select></div>' : '')
    + '<div><label for="mesTheme">Thématique</label><select id="mesTheme"><option value="">Toutes</option>' + themes.map(function(t){ return '<option' + (t === m.theme ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></div>'
    + '<div><label for="mesTri">Ordre</label><select id="mesTri">'
    + [['recent', 'Plus récents'], ['ancien', 'Plus anciens'], ['sujet', 'Par sujet']].map(function(o){ return '<option value="' + o[0] + '"' + (o[0] === m.tri ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('')
    + '</select></div>'
    + '<div class="large"><label for="mesQ">Rechercher</label><input type="search" id="mesQ" placeholder="Sujet, candidat, auteur ou mot du texte" value="' + esc(m.q) + '"></div>'
    + '</div><div id="mesListe"></div>';
  vue.innerHTML = h;

  var ordreTheme = {};
  S.themes.forEach(function(t, i){ ordreTheme[t] = i; });
  var trier = function(a, b){
    if(m.tri === 'ancien') return a.depose_le < b.depose_le ? -1 : a.depose_le > b.depose_le ? 1 : a.id - b.id;
    if(m.tri === 'sujet'){
      var sa = S.sujetById[a.sujet_id] || {}, sb2 = S.sujetById[b.sujet_id] || {};
      return ((ordreTheme[sa.thematique] || 0) - (ordreTheme[sb2.thematique] || 0)) || ((sa.ordre || 0) - (sb2.ordre || 0))
        || String(a.candidat || '').localeCompare(String(b.candidat || ''), 'fr') || (a.depose_le < b.depose_le ? 1 : -1);
    }
    return a.depose_le < b.depose_le ? 1 : a.depose_le > b.depose_le ? -1 : b.id - a.id;
  };
  var normal = function(t){ return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };

  function dessinerListe(){
    var q = normal(m.q.trim());
    var garde = function(d){
      if(m.statut !== 'tous' && etat(d) !== m.statut) return false;
      if(m.circuit && d.circuit !== m.circuit) return false;
      if(m.theme){ var x = S.sujetById[d.sujet_id]; if(!x || (x.thematique !== m.theme && (x.aussi_dans || []).indexOf(m.theme) < 0)) return false; }
      if(q && normal([d.texte, libelleSujet(d.sujet_id), d.sujet_id, d.candidat, d.auteur, d.motif].join(' ')).indexOf(q) < 0) return false;
      return true;
    };
    var visibles = liste.filter(garde).sort(trier);
    /* Les refusés à reprendre passent toujours devant, quel que soit l'ordre choisi. */
    var tete2 = visibles.filter(function(d){ return idsReprendre[d.id]; }), reste = visibles.filter(function(d){ return !idsReprendre[d.id]; });
    var montres = tete2.concat(reste).slice(0, m.n);
    var w = $('mesListe');
    if(!visibles.length){ w.innerHTML = '<div class="note info">Aucun dépôt ne correspond à ces critères.</div>'; return; }
    var html = '<p class="muted">' + visibles.length + ' dépôt' + (visibles.length > 1 ? 's' : '') + (visibles.length < liste.length ? ' sur ' + liste.length : '') + (montres.length < visibles.length ? ', ' + montres.length + ' affichés' : '') + '.</p>';
    var section = null;
    montres.forEach(function(d){
      if(m.statut === 'tous' && tete2.length){
        var sec = idsReprendre[d.id] ? 'r' : 'a';
        if(sec !== section){ section = sec; html += '<h3>' + (sec === 'r' ? 'À reprendre (' + tete2.length + ')' : 'Les autres dépôts (' + reste.length + ')') + '</h3>'; }
      }
      html += carteDepot(d, idsReprendre[d.id] ? 'mes' : etat(d) === 'repris' ? 'vu' : 'mes');
    });
    if(montres.length < visibles.length){
      var encore = Math.min(30, visibles.length - montres.length);
      html += '<div class="actions" style="justify-content:center;margin-bottom:20px"><button class="btn" id="mesPlus">Afficher ' + encore + ' de plus</button><button class="btn" id="mesTout">Tout afficher (' + visibles.length + ')</button></div>';
    }
    w.innerHTML = html;
    if($('mesPlus')) $('mesPlus').onclick = function(){ m.n += 30; dessinerListe(); };
    if($('mesTout')) $('mesTout').onclick = function(){ m.n = visibles.length; dessinerListe(); };
    w.querySelectorAll('[data-act="redeposer"]').forEach(function(b){
      b.onclick = function(){
        var id = parseInt(b.closest('[data-depot]').getAttribute('data-depot'), 10);
        var d = liste.filter(function(x){ return x.id === id; })[0], s = S.sujetById[d.sujet_id];
        /* Une correction refusée repart du texte en ligne actuel, jamais de l'ancien :
           on évite ainsi d'effacer ce qui a été ajouté entre-temps. */
        var correction = d.circuit === 'verbatim' && d.mode === 'remplacement';
        S.form = nouveauFormulaire(d.circuit);
        Object.assign(S.form, { theme:s ? s.thematique : '', sujet:d.sujet_id, candidat:d.candidat || '', auteur:d.auteur, initiales:d.initiales, age:d.age || '',
          texte:correction ? '' : d.texte, ancienTexte:correction ? d.texte : null, mode:d.circuit === 'verbatim' ? d.mode : null,
          sources:d.circuit === 'verbatim' ? [] : d.sources.slice(), docs:d.circuit === 'verbatim' ? d.sources.slice() : [], remplace:d.remplace, suite_de:d.id, motifPrecedent:d.motif, relecteurs:['', ''] });
        S.tab = 'deposer'; afficher();
      };
    });
  }
  var change = function(){ m.n = 30; garderFiltresMes(); dessinerListe(); };
  vue.querySelectorAll('[data-statut]').forEach(function(b){
    b.onclick = function(){
      m.statut = b.getAttribute('data-statut');
      vue.querySelectorAll('[data-statut]').forEach(function(x){ x.classList.toggle('on', x === b); });
      change();
    };
  });
  if($('mesCircuit')) $('mesCircuit').onchange = function(){ m.circuit = this.value; change(); };
  $('mesTheme').onchange = function(){ m.theme = this.value; change(); };
  $('mesTri').onchange = function(){ m.tri = this.value; change(); };
  var minuteur = null;
  $('mesQ').oninput = function(){ var v = this.value; clearTimeout(minuteur); minuteur = setTimeout(function(){ m.q = v; m.n = 30; dessinerListe(); }, 200); };
  dessinerListe();
}

/* =====================================================================
   À VALIDER (mainteneurs)
   ===================================================================== */
async function vueValider(){
  var vue = $('vue');
  var tete0 = prendreFlash();
  vue.innerHTML = tete0 + '<p class="muted">Chargement…</p>';
  var r = await sb.from('depots').select('*').eq('statut', 'en attente').order('depose_le').limit(200);
  if(r.error) throw r.error;
  var liste = r.data;
  S.nAttente = liste.length;
  /* Pour chaque dépôt : le texte en ligne à cet endroit, et le refus auquel il fait suite. */
  await Promise.all(liste.map(async function(d){
    if(d.circuit === 'verbatim'){
      var p = await sb.from('positions').select('texte').eq('sujet_id', d.sujet_id).eq('candidat', d.candidat).maybeSingle();
      d._actuel = p.data ? p.data.texte : null;
    } else if(d.remplace){
      var e = await sb.from('editorial').select('texte').eq('id', d.remplace).maybeSingle();
      d._actuel = e.data ? e.data.texte : null;
    }
    if(d.suite_de){
      var x = await sb.from('depots').select('motif').eq('id', d.suite_de).maybeSingle();
      d._precedent = x.data;
    }
  }));
  var tete = tete0 + '<p>Votre rôle ici : vérifier que le circuit a été respecté (bon sujet, relecteurs indiqués, registre respecté). Vous ne pouvez pas valider un texte que vous avez déposé.</p>';

  /* Filtre par déposant : les miens, ceux des autres, ou une personne précise. */
  var moi = S.session.user.id, parDeposant = {}, nMoi = 0;
  liste.forEach(function(d){
    var k = d.depose_par || 'inconnu';
    parDeposant[k] = (parDeposant[k] || 0) + 1;
    if(d.depose_par === moi) nMoi++;
  });
  var nomDe = function(k){ return k === 'inconnu' ? 'Compte supprimé' : (S.pseudos[k] || 'Compte supprimé'); };
  var autresIds = Object.keys(parDeposant).filter(function(k){ return k !== moi; })
    .sort(function(a, b){ return nomDe(a).localeCompare(nomDe(b), 'fr'); });
  if(S.filtreValider == null) S.filtreValider = lireFiltre();
  var f = S.filtreValider;
  if(f !== 'tous' && f !== 'autres' && f !== 'moi' && !parDeposant[f]) f = 'tous';   /* déposant qui n'a plus rien en attente */
  var garde = function(d){
    if(f === 'tous') return true;
    if(f === 'autres') return d.depose_par !== moi;
    if(f === 'moi') return d.depose_par === moi;
    return (d.depose_par || 'inconnu') === f;
  };
  var visibles = liste.filter(garde);
  var opt = function(v, lib){ return '<option value="' + esc(v) + '"' + (v === f ? ' selected' : '') + '>' + esc(lib) + '</option>'; };
  var barre = liste.length ? '<div class="filtre"><label for="filtreDep">Déposé par</label><select id="filtreDep">'
      + opt('tous', 'Tous les déposants (' + liste.length + ')')
      + opt('autres', 'Les autres, que je peux valider (' + (liste.length - nMoi) + ')')
      + opt('moi', 'Moi (' + nMoi + ')')
      + (autresIds.length ? '<optgroup label="Un déposant">' + autresIds.map(function(k){ return opt(k, nomDe(k) + ' (' + parDeposant[k] + ')'); }).join('') + '</optgroup>' : '')
      + '</select>' + (f !== 'tous' ? '<span class="muted">' + visibles.length + ' sur ' + liste.length + ' affiché' + (visibles.length > 1 ? 's' : '') + '</span>' : '') + '</div>' : '';
  var vide = !liste.length ? '<div class="note ok">Rien à valider pour l\'instant.</div>'
    : !visibles.length ? '<div class="note info">Aucun dépôt en attente pour ce choix.</div>' : '';
  vue.innerHTML = tete + barre + (vide || visibles.map(function(d){ return carteDepot(d, 'valider'); }).join(''));
  if($('filtreDep')) $('filtreDep').onchange = function(){ garderFiltre(this.value); vueValider(); };
  document.querySelectorAll('.tab[data-tab="valider"]').forEach(function(t){ t.innerHTML = 'À valider' + (S.nAttente ? '<span class="n">' + S.nAttente + '</span>' : ''); });
  vue.querySelectorAll('[data-act]').forEach(function(b){
    b.onclick = async function(){
      var id = parseInt(b.closest('[data-depot]').getAttribute('data-depot'), 10), act = b.getAttribute('data-act');
      try {
        if(act === 'valider'){
          if(!await demander({ titre:'Publier ce texte sur le site ?', texte:'Il sera visible de tous les visiteurs immédiatement.', ok:'Valider et publier' })) return;
          await rpc('valider_depot', { p_id:id });
          flash('ok', 'Texte publié.');
        } else {
          var motif = await demander({ titre:'Refuser ce dépôt', motif:'Motif, transmis au déposant', ok:'Refuser', danger:true });
          if(motif == null) return;
          await rpc('refuser_depot', { p_id:id, p_motif:motif });
          flash('ok', 'Dépôt refusé. Le déposant voit le motif dans « Mes dépôts ».');
        }
      } catch(e){ flash('err', msgErreur(e)); }
      vueValider();
    };
  });
}

var CLASSE_DOC = { 'en attente':'attente', 'publié':'publie', 'refusé':'refuse', 'retiré':'retire' };
function docActif(b){ return b.statut === 'publié' || b.statut === 'en attente'; }

function carteDoc(d, mode, ctx){
  var h = '<div class="card" data-doc="' + esc(d.id) + '"><span class="badge ' + (CLASSE_DOC[d.statut] || '') + '">' + esc(d.statut) + '</span> <span class="muted">' + esc(d.id) + '</span>'
    + '<h2 style="margin-top:8px">' + esc(d.titre) + '</h2>'
    + '<div class="meta">' + [mode === 'valider' ? '<b>' + esc(d.auteurs) + '</b>' : '', esc(d.organisme), d.date_publication ? 'publié en ' + esc(d.date_publication) : '', d.date_consultation ? 'consulté le ' + esc(d.date_consultation) : '',
        S.profil.mainteneur && d.cree_par && S.pseudos[d.cree_par] ? 'déposé par <b>' + esc(S.pseudos[d.cree_par]) + '</b>' : ''].filter(Boolean).join(' · ') + '</div>'
    + '<div class="doc-liens">' + (/^https?:\/\//i.test(d.url) ? '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.url) + ' ↗</a>' : esc(d.url))
    + (/^https?:\/\//i.test(d.archive || '') ? ' · <a href="' + esc(d.archive) + '" target="_blank" rel="noopener">version archivée ↗</a>' : '') + '</div>';
  if(d.motif && (d.statut === 'refusé' || d.statut === 'retiré')) h += '<div class="note ' + (d.statut === 'refusé' ? 'err' : 'info') + '">' + (d.statut === 'refusé' ? 'Refusé' : 'Retiré') + (d.traite_le ? ' le ' + esc(dateFr(d.traite_le)) : '') + ' — ' + esc(d.motif) + '</div>';
  if(mode === 'liste' && ctx.estCand && docActif(d)){
    var n = ctx.parDoc[d.id] || 0;
    h += '<div class="meta"><span data-compte="' + esc(d.id) + '">' + n + ' case' + (n > 1 ? 's' : '') + ' rattachée' + (n > 1 ? 's' : '') + '</span></div>';
  }
  var act = [];
  if(mode === 'valider'){
    var sien = d.cree_par === S.session.user.id;
    act.push('<button class="btn pri" data-act="valider"' + (sien ? ' disabled' : '') + '>Valider et publier</button>', '<button class="btn danger" data-act="refuser">Refuser…</button>');
    if(sien) act.push('<span class="muted">Vous avez déposé ce document : un autre mainteneur doit le valider.</span>');
  } else {
    if(ctx.estCand && docActif(d) && (S.profil.veille || S.profil.mainteneur)) act.push('<button class="btn" data-act="ratt">Rattacher des cases</button>');
    if(S.profil.mainteneur && d.statut === 'publié') act.push('<button class="btn danger small" data-act="retirer">Retirer du site…</button>');
  }
  if(act.length) h += '<div class="actions">' + act.join('') + '</div>';
  return h + '</div>';
}

    h += '<details id="detDepDoc"' + (S.progOuvert ? ' open' : '') + '><summary>Déposer un nouveau document</summary><div><div class="card">'
      + '<div class="row"><div class="field"><label for="ndCand">Candidat</label><select id="ndCand"><option value="">— choisir —</option>' + opts + '</select></div>'
      + '<div class="field"><label for="ndTitre">Titre du document</label><input type="text" id="ndTitre" placeholder="Tel qu\'il figure sur la page"></div></div>'
      + '<div class="row"><div class="field"><label for="ndUrl">Adresse web</label><input type="url" id="ndUrl" placeholder="https://…"></div>'
      + '<div class="field"><label for="ndOrg">Site ou éditeur (facultatif)</label><input type="text" id="ndOrg" placeholder="Ex. nom du site de campagne"></div></div>'
      + '<div class="row"><div class="field"><label for="ndDate">Date de publication</label><input type="text" id="ndDate" placeholder="2026"></div>'
      + '<div class="field"><label for="ndConsult">Date de consultation</label><input type="text" id="ndConsult" value="' + esc(new Date().toLocaleDateString('fr-FR')) + '"><small>Remplie avec la date du jour : modifiez-la si vous avez consulté le document un autre jour.</small></div></div>'
      + '<div class="field"><label for="ndArch">Lien d\'archive (facultatif)</label><input type="url" id="ndArch" placeholder="https://web.archive.org/…"><small>Une copie datée de la page, utile si le candidat modifie ou retire son texte.</small></div>'
      + '<div class="actions"><button class="btn pri" id="btnDepDoc">Déposer pour validation</button></div><div id="ndMsg"></div></div></div></details>';
  }
  vue.innerHTML = h;
  if(ctx.bilan) ctx.bilan();

  $('progCand').onchange = function(){ S.progCand = this.value; S.progDoc = null; vueProgrammes(); };
  if($('detDepDoc')) $('detDepDoc').ontoggle = function(){ S.progOuvert = this.open; };
  vue.querySelectorAll('[data-doc] [data-act]').forEach(function(b){
    b.onclick = async function(){
      var id = b.closest('[data-doc]').getAttribute('data-doc'), act = b.getAttribute('data-act');
      if(act === 'ratt'){ S.progDoc = id; afficherRattachement(ctx); $('rattZone').scrollIntoView({ block:'start' }); return; }
      try {
        if(act === 'valider'){
          if(!await demander({ titre:'Publier ce document ?', texte:'Il paraîtra aussitôt sur la page Sources du site, dans le corpus de son candidat.', ok:'Valider et publier' })) return;
          await rpc('valider_programme', { p_id:id });
          flash('ok', 'Document publié sur la page Sources.');
        } else if(act === 'refuser'){
          var motif = await demander({ titre:'Refuser ce document', motif:'Motif, visible dans cet onglet', ok:'Refuser', danger:true });
          if(motif == null) return;
          await rpc('refuser_programme', { p_id:id, p_motif:motif });
          flash('ok', 'Document refusé.');
        } else if(act === 'retirer'){
          var m2 = await demander({ titre:'Retirer ce document du site ?', texte:'Il disparaît aussitôt de la page Sources. Il reste conservé avec ses rattachements, et peut revenir par un nouveau dépôt validé par un autre mainteneur. Si le candidat a abandonné ces positions, pensez à dépublier les cases qui en sont tirées (onglet En ligne).', motif:'Motif (facultatif)', motifFacultatif:true, ok:'Retirer', danger:true });
          if(m2 == null) return;
          await rpc('retirer_programme', { p_id:id, p_motif:m2 });
          flash('ok', 'Document retiré du site.');
        }
      } catch(e){ flash('err', msgErreur(e)); }
      vueProgrammes();
    };
  });
  if($('btnDepDoc')) $('btnDepDoc').onclick = async function(){
    var m = $('ndMsg'), bouton = this, cand = $('ndCand').value, titre = $('ndTitre').value.trim(), url = $('ndUrl').value.trim(), arch = $('ndArch').value.trim();
    if(!cand || !titre || !url){ m.innerHTML = '<div class="note err">Le candidat, le titre et l\'adresse web sont obligatoires.</div>'; return; }
    if(!/^https?:\/\//i.test(url) || (arch && !/^https?:\/\//i.test(arch))){ m.innerHTML = '<div class="note err">Les adresses doivent commencer par https://</div>'; return; }
    bouton.disabled = true;
    try {
      var id = await rpc('deposer_programme', { p_candidat:cand, p_titre:titre, p_url:url, p_organisme:$('ndOrg').value, p_date_publication:$('ndDate').value, p_date_consultation:$('ndConsult').value, p_archive:arch });
      S.progCand = cand; S.progOuvert = false;
      flash('ok', 'Document déposé (' + id + '). Il paraîtra sur la page Sources dès qu\'un mainteneur l\'aura validé. Vous pouvez déjà y rattacher des cases.');
      vueProgrammes();
    } catch(e){ m.innerHTML = '<div class="note err">' + esc(msgErreur(e)) + '</div>'; bouton.disabled = false; }
  };
  if(S.progDoc && S.srcById[S.progDoc] && S.srcById[S.progDoc].auteurs === c && docActif(S.srcById[S.progDoc])) afficherRattachement(ctx);
  else S.progDoc = null;
}

/* Rattacher les cases d'un candidat à l'un de ses documents. Chaque coche est
   enregistrée aussitôt ; la liste n'est pas redessinée, pour ne pas perdre sa place. */
function afficherRattachement(ctx){
  var d = S.srcById[S.progDoc], z = $('rattZone');
  if(!d || !z) return;
  var ordreTheme = {};
  S.themes.forEach(function(t, i){ ordreTheme[t] = i; });
  var cases = ctx.pos.map(function(p){ return { p:p, s:S.sujetById[p.sujet_id] || { id:p.sujet_id, libelle:p.sujet_id, thematique:'', ordre:0, aussi_dans:[] } }; })
    .sort(function(a, b){ return (ordreTheme[a.s.thematique] || 0) - (ordreTheme[b.s.thematique] || 0) || (a.s.ordre || 0) - (b.s.ordre || 0); });
  var themes = S.themes.filter(function(t){ return cases.some(function(x){ return x.s.thematique === t || (x.s.aussi_dans || []).indexOf(t) >= 0; }); });
  if(S.progTheme && themes.indexOf(S.progTheme) < 0) S.progTheme = '';
  var visibles = cases.filter(function(x){
    var l = ctx.parCase[x.p.sujet_id] || [];
    if(S.progTheme && x.s.thematique !== S.progTheme && (x.s.aussi_dans || []).indexOf(S.progTheme) < 0) return false;
    if(S.progSansDoc && l.length && l.indexOf(d.id) < 0) return false;
    return true;
  });
  var extrait = function(t){ t = String(t); return t.length > 220 ? t.slice(0, 220) + '…' : t; };
  z.innerHTML = '<div class="card" id="rattCard"><h2>Rattacher des cases à « ' + esc(d.titre) + ' »</h2>'
    + '<p class="muted">Cochez les cases de ' + esc(ctx.c) + ' tirées de ce document, en tout ou partie. Chaque coche est enregistrée aussitôt. Une case peut être rattachée à plusieurs documents.</p>'
    + '<div class="row"><div class="field"><label for="rattTheme">Thématique</label><select id="rattTheme"><option value="">Toutes</option>' + themes.map(function(t){ return '<option' + (t === S.progTheme ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></div></div>'
    + '<label class="choix"><input type="checkbox" id="rattSans"' + (S.progSansDoc ? ' checked' : '') + '><span>Masquer les cases déjà rattachées à un autre document</span></label>'
    + '<p class="muted" style="margin:8px 0 0">' + visibles.length + ' case' + (visibles.length > 1 ? 's' : '') + ' affichée' + (visibles.length > 1 ? 's' : '') + '.</p><div id="rattMsg"></div>'
    + '<div id="rattListe">' + (visibles.length ? visibles.map(function(x){
        var l = ctx.parCase[x.p.sujet_id] || [], autresDocs = l.filter(function(id){ return id !== d.id; });
        return '<label class="caseline"><input type="checkbox" data-sujet="' + esc(x.p.sujet_id) + '"' + (l.indexOf(d.id) >= 0 ? ' checked' : '') + '><span class="t"><b>' + esc(x.s.libelle) + '</b> <span class="muted">(' + esc(x.s.thematique) + ')</span>'
          + '<span class="ex">« ' + esc(extrait(x.p.texte)) + ' »</span>'
          + (autresDocs.length ? '<span class="aussi">Aussi rattachée à : ' + autresDocs.map(function(id){ return esc(S.srcById[id] ? S.srcById[id].titre : id); }).join(', ') + '</span>' : '') + '</span></label>';
      }).join('') : '<p class="muted">Aucune case à afficher avec ces filtres.</p>') + '</div>'
    + '<div class="actions"><button class="btn" id="rattFermer">Fermer</button></div></div>';
  $('rattTheme').onchange = function(){ S.progTheme = this.value; afficherRattachement(ctx); };
  $('rattSans').onchange = function(){ S.progSansDoc = this.checked; afficherRattachement(ctx); };
  $('rattFermer').onclick = function(){ S.progDoc = null; z.innerHTML = ''; };
  z.querySelectorAll('input[data-sujet]').forEach(function(cb){
    cb.onchange = async function(){
      var sid = cb.getAttribute('data-sujet'), oui = cb.checked;
      cb.disabled = true;
      try {
        await rpc(oui ? 'rattacher_case' : 'detacher_case', { p_sujet:sid, p_candidat:ctx.c, p_source:d.id });
        var l = ctx.parCase[sid] = ctx.parCase[sid] || [], i = l.indexOf(d.id);
        if(oui && i < 0){ l.push(d.id); ctx.parDoc[d.id] = (ctx.parDoc[d.id] || 0) + 1; }
        if(!oui && i >= 0){ l.splice(i, 1); ctx.parDoc[d.id] = Math.max(0, (ctx.parDoc[d.id] || 0) - 1); }
        var n = ctx.parDoc[d.id] || 0, sp = document.querySelector('[data-compte="' + d.id + '"]');
        if(sp) sp.textContent = n + ' case' + (n > 1 ? 's' : '') + ' rattachée' + (n > 1 ? 's' : '');
        if(ctx.bilan) ctx.bilan();
        $('rattMsg').innerHTML = '';
      } catch(e){ cb.checked = !oui; $('rattMsg').innerHTML = '<div class="note err">' + esc(msgErreur(e)) + '</div>'; }
      cb.disabled = false;
    };
  });
}

function chargerXLSX(){

    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
